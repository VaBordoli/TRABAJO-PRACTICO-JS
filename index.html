<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
      <!-- Para filtros y navegacion -->
    </header>


    <main class="comida-container" id="comidaContainer">
        <!-- Contenido Dinamico -->
    </main>    


<section class="addfood">
  <h2> Agregar comida</h2>
  <form id="agregarComidaForm">
    <label for="nombre">Nombre de la comida:</label>
    <input type="text" id="nombre" name="nombre" placeholder="Nombre de la comida" required>


    <label> Categoria</label>
    <input type="text" placeholder="Nombre de la categoria" name="categoria" required>
     
    <label> Provincia</label>
    <input type="text" placeholder="Nombre de la Provincia" name="provincia" required>


    <label> Ingredientes (separados por ,)</label>
    <input type="text" placeholder="Ingredientes de la comida" name="ingredientes" required>


    <button type="submit"> Agregar comida</button>


  </form>
</section>


<script type="module" src="./main.js"></script>

<input type = "search" id="buscador" placeholder="Buscar por nombre, provincia o categoria">

<select id="filtroCategoria">
  <option value=""> Todas las categorias</option>
  <option value="Parrilla"> Parrilla</option>
  <option value="Horno"> Horno</option>
  <option value="Guiso"> Guiso</option>
  <option value="Frito"> Frito</option>
  
</select>


<select id="filtroProvincia">
  <option value=""> Todas las provincias</option>
  <option value="Buenos Aires"> Buenos Aires</option>
  <option value="Cordoba"> Cordoba</option>
  <option value="Jujuy"> Jujuy</option>
  <option value="Entre rios"> Entre rios</option>
  
</select>
</body>
</html>
